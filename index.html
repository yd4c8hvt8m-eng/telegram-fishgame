<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0878b8">

    <title>Fish Match</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- ================= HEADER ================= -->

    <header class="game-header">

        <div class="player">

            <div id="avatar" class="avatar">
                ?
            </div>

            <div class="player-info">

                <div
                    id="playerName"
                    class="player-name"
                >
                    Игрок
                </div>

                <div class="level-text">
                    Уровень
                    <span id="level">1</span>
                </div>

            </div>

        </div>

        <div class="coins">
            <span class="coin-icon">🪙</span>
            <span id="coins">100</span>
        </div>

    </header>


    <!-- ================= STATS ================= -->

    <section class="stats">

        <div class="stat-box">

            <div class="stat-title">
                ОЧКИ
            </div>

            <div
                id="score"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat-box">

            <div class="stat-title">
                ХОДЫ
            </div>

            <div
                id="moves"
                class="stat-value"
            >
                30
            </div>

        </div>

    </section>


    <!-- ================= TARGET ================= -->

    <section class="target-panel">

        <div class="target-title">
            ЦЕЛЬ УРОВНЯ
        </div>

        <div class="target-items">

            <div class="target-item">

                <span class="target-emoji">
                    🔵
                </span>

                <span id="blueTarget">
                    0 / 10
                </span>

            </div>


            <div class="target-item">

                <span class="target-emoji">
                    🟢
                </span>

                <span id="greenTarget">
                    0 / 10
                </span>

            </div>

        </div>

    </section>


    <!-- ================= GAME ================= -->

    <main>

        <div
            id="gameBoard"
            class="game-board"
        ></div>

    </main>


    <!-- ================= BOOSTERS ================= -->

    <section class="boosters">

        <button
            id="shuffleButton"
            class="booster"
            type="button"
        >

            <span class="booster-icon">
                🔀
            </span>

            <span class="booster-name">
                Перемешать
            </span>

        </button>


        <button
            id="bombButton"
            class="booster"
            type="button"
        >

            <span class="booster-icon">
                💣
            </span>

            <span class="booster-name">
                Бомба
            </span>

        </button>


        <button
            id="undoButton"
            class="booster"
            type="button"
        >

            <span class="booster-icon">
                ↩️
            </span>

            <span class="booster-name">
                Отмена
            </span>

        </button>

    </section>


    <!-- ================= GAME MESSAGE ================= -->

    <div
        id="message"
        class="message hidden"
    >

        <div class="message-window">

            <div
                id="messageIcon"
                class="message-icon"
            >
                🎉
            </div>

            <h2 id="messageTitle">
                Уровень пройден!
            </h2>

            <p id="messageText">
                Отличная работа!
            </p>

            <button
                id="nextLevelButton"
                class="main-button"
                type="button"
            >
                Следующий уровень
            </button>

        </div>

    </div>


    <!-- ================= LOADING ================= -->

    <div
        id="loading"
        class="loading"
    >

        <div class="loading-spinner"></div>

        <div>
            Загрузка...
        </div>

    </div>

</div>


<script src="game.js"></script>

</body>

</html>
