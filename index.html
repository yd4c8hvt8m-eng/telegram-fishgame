<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#0878b8">

<title>Fish Match</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #73d9f5 0%,
            #299fd4 45%,
            #066da8 100%
        );

    color: white;

    overflow-x: hidden;

    user-select: none;
    -webkit-user-select: none;
}


/* =========================================================
   APP
========================================================= */

#app {
    width: 100%;
    max-width: 520px;

    min-height: 100vh;
    min-height: 100dvh;

    margin: 0 auto;

    padding:
        calc(10px + env(safe-area-inset-top))
        10px
        calc(18px + env(safe-area-inset-bottom));
}


/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;
}

.player {
    display: flex;
    align-items: center;

    gap: 9px;
}

.avatar {
    width: 43px;
    height: 43px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: white;

    color: #087db8;

    font-weight: 800;

    overflow: hidden;

    box-shadow:
        0 3px 8px rgba(0,0,0,.25);
}

.avatar img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.player-name {
    max-width: 180px;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 15px;
    font-weight: 700;
}

.level {
    margin-top: 2px;

    font-size: 11px;

    opacity: .8;
}

.coins {
    display: flex;
    align-items: center;

    gap: 5px;

    padding:
        7px 12px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.16);

    font-weight: 700;
}


/* =========================================================
   TOP
========================================================= */

.top {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-bottom: 8px;
}

.stat {
    padding: 7px;

    border-radius: 14px;

    text-align: center;

    background:
        rgba(255,255,255,.18);

    border:
        1px solid
        rgba(255,255,255,.25);
}

.stat-title {
    font-size: 9px;

    opacity: .8;

    letter-spacing: .5px;
}

.stat-value {
    margin-top: 2px;

    font-size: 21px;

    font-weight: 800;
}


/* =========================================================
   LEVEL TARGET
========================================================= */

.target {
    margin-bottom: 10px;

    padding:
        9px 12px;

    border-radius: 14px;

    background:
        rgba(0,45,85,.20);
}

.target-title {
    margin-bottom: 6px;

    font-size: 9px;

    opacity: .8;

    letter-spacing: .5px;
}

.targets {
    display: flex;

    gap: 18px;
}

.target-item {
    display: flex;

    align-items: center;

    gap: 6px;

    font-size: 13px;

    font-weight: 700;
}

.target-gem {
    width: 20px;
    height: 20px;

    border-radius: 50%;

    box-shadow:
        inset 2px 2px 4px rgba(255,255,255,.65),
        inset -2px -3px 4px rgba(0,0,0,.25);
}


/* =========================================================
   BOARD
========================================================= */

.board {
    position: relative;

    width: 100%;

    aspect-ratio: 1;

    padding: 5px;

    display: grid;

    grid-template-columns:
        repeat(8,1fr);

    grid-template-rows:
        repeat(8,1fr);

    gap: 4px;

    border-radius: 18px;

    background:
        rgba(0,48,80,.34);

    box-shadow:
        inset 0 2px 5px rgba(0,0,0,.25),
        0 8px 18px rgba(0,0,0,.25);

    touch-action: none;
}


/* =========================================================
   CELL
========================================================= */

.cell {
    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background:
        rgba(255,255,255,.08);

    cursor: pointer;
}


/* =========================================================
   GEM
========================================================= */

.gem {
    position: relative;

    width: 78%;
    height: 78%;

    border-radius: 30%;

    transform:
        rotate(45deg);

    transition:
        transform .12s ease,
        filter .12s ease;

    box-shadow:
        inset
        4px 4px 5px
        rgba(255,255,255,.55),

        inset
        -5px -6px 7px
        rgba(0,0,0,.28),

        0 2px 4px
        rgba(0,0,0,.3);
}


/* Shine */

.gem::before {
    content: "";

    position: absolute;

    width: 42%;
    height: 18%;

    left: 12%;
    top: 10%;

    border-radius: 50%;

    background:
        rgba(255,255,255,.6);

    transform:
        rotate(-45deg);
}


/* =========================================================
   GEM COLORS
========================================================= */

.gem-0 {
    background:
        linear-gradient(
            145deg,
            #5ee7ff,
            #1689e6
        );
}

.gem-1 {
    background:
        linear-gradient(
            145deg,
            #74f58b,
            #16a83c
        );
}

.gem-2 {
    background:
        linear-gradient(
            145deg,
            #ff7070,
            #d51d32
        );
}

.gem-3 {
    background:
        linear-gradient(
            145deg,
            #fff06a,
            #e6a600
        );
}

.gem-4 {
    background:
        linear-gradient(
            145deg,
            #e681ff,
            #8a28d1
        );
}

.gem-5 {
    background:
        linear-gradient(
            145deg,
            #ffb366,
            #ed641d
        );
}


/* =========================================================
   SELECTED
========================================================= */

.cell.selected .gem {
    transform:
        rotate(45deg)
        scale(.78);

    filter:
        brightness(1.35);

    box-shadow:
        0 0 0 3px white,
        0 0 15px rgba(255,255,255,.9);
}


/* =========================================================
   SPECIAL BOMB
========================================================= */

.special-bomb {
    animation:
        bombPulse
        1s
        infinite;
}

.special-bomb::after {
    content: "✦";

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 17px;

    transform:
        rotate(-45deg);

    text-shadow:
        0 1px 3px #000;
}

@keyframes bombPulse {

    50% {
        filter:
            brightness(1.3);
    }

}


/* =========================================================
   REMOVE
========================================================= */

.removing {
    animation:
        destroy
        .25s
        ease
        forwards;
}

@keyframes destroy {

    0% {
        transform:
            scale(1);
        opacity: 1;
    }

    50% {
        transform:
            scale(1.25);
        opacity: .8;
    }

    100% {
        transform:
            scale(0);
        opacity: 0;
    }

}


/* =========================================================
   SCORE POPUP
========================================================= */

.score-popup {
    position: fixed;

    z-index: 500;

    pointer-events: none;

    font-size: 22px;

    font-weight: 900;

    color: white;

    text-shadow:
        0 2px 4px rgba(0,0,0,.6);

    animation:
        scoreFloat
        .8s
        ease
        forwards;
}

@keyframes scoreFloat {

    0% {
        opacity: 0;

        transform:
            translateY(10px)
            scale(.7);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translateY(-55px)
            scale(1.15);
    }

}


/* =========================================================
   COMBO
========================================================= */

.combo {
    position: fixed;

    z-index: 600;

    left: 50%;

    top: 42%;

    transform:
        translate(-50%,-50%);

    pointer-events: none;

    font-size: 32px;

    font-weight: 900;

    text-shadow:
        0 3px 7px rgba(0,0,0,.6);

    animation:
        comboAnimation
        .8s
        ease
        forwards;
}

@keyframes comboAnimation {

    0% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.5);
    }

    30% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(1.25);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%,-75%)
            scale(1);
    }

}


/* =========================================================
   BOOSTERS
========================================================= */

.boosters {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 7px;

    margin-top: 10px;
}

.booster {
    padding:
        8px 4px;

    border: none;

    border-radius: 13px;

    color: white;

    background:
        rgba(255,255,255,.2);

    box-shadow:
        0 3px 6px rgba(0,0,0,.2);

    cursor: pointer;
}

.booster:active {
    transform:
        scale(.95);
}

.booster:disabled {
    opacity: .45;
}

.booster-icon {
    display: block;

    font-size: 21px;
}

.booster-name {
    display: block;

    margin-top: 3px;

    font-size: 9px;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.55);
}

.message.hidden {
    display: none;
}

.message-window {
    width: 100%;
    max-width: 360px;

    padding:
        28px 20px;

    text-align: center;

    color: #12618a;

    border-radius: 24px;

    background:
        linear-gradient(
            180deg,
            white,
            #e7f8ff
        );

    box-shadow:
        0 15px 40px rgba(0,0,0,.35);

    animation:
        popup .25s ease;
}

.message-icon {
    font-size: 55px;
}

.message-window h2 {
    margin:
        9px 0 5px;
}

.message-window p {
    margin:
        0 0 20px;

    color: #47788d;
}

.main-button {
    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 14px;

    color: white;

    font-size: 16px;

    font-weight: 700;

    background:
        linear-gradient(
            180deg,
            #39c8f1,
            #087fc1
        );

    cursor: pointer;
}

@keyframes popup {

    from {
        transform:
            scale(.7);

        opacity: 0;
    }

    to {
        transform:
            scale(1);

        opacity: 1;
    }

}


/* =========================================================
   LOADING
========================================================= */

.loading {
    position: fixed;

    inset: 0;

    z-index: 2000;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 10px;

    background:
        linear-gradient(
            180deg,
            #73d9f5,
            #0878b8
        );

    transition:
        opacity .3s;
}

.loading.hidden {
    opacity: 0;

    pointer-events: none;
}

.spinner {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    border:
        4px solid
        rgba(255,255,255,.3);

    border-top-color:
        white;

    animation:
        spin .7s linear infinite;
}

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}


/* =========================================================
   SMALL SCREEN
========================================================= */

@media (max-width:360px) {

    #app {
        padding-left: 7px;
        padding-right: 7px;
    }

    .board {
        gap: 3px;
        padding: 4px;
    }

    .cell {
        border-radius: 9px;
    }

}

</style>

</head>


<body>


<div id="app">


    <!-- HEADER -->

    <header class="header">

        <div class="player">

            <div
                id="avatar"
                class="avatar"
            >
                ?
            </div>

            <div>

                <div
                    id="playerName"
                    class="player-name"
                >
                    Игрок
                </div>

                <div class="level">

                    Уровень
                    <span id="level">
                        1
                    </span>

                </div>

            </div>

        </div>


        <div class="coins">

            🪙

            <span id="coins">
                100
            </span>

        </div>

    </header>


    <!-- STATS -->

    <section class="top">

        <div class="stat">

            <div class="stat-title">
                ОЧКИ
            </div>

            <div
                id="score"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                ХОДЫ
            </div>

            <div
                id="moves"
                class="stat-value"
            >
                30
            </div>

        </div>

    </section>


    <!-- TARGET -->

    <section class="target">

        <div class="target-title">
            ЦЕЛЬ УРОВНЯ
        </div>

        <div class="targets">

            <div class="target-item">

                <span
                    id="targetBlueGem"
                    class="target-gem gem-0"
                ></span>

                <span id="blueTarget">
                    0 / 10
                </span>

            </div>


            <div class="target-item">

                <span
                    id="targetGreenGem"
                    class="target-gem gem-1"
                ></span>

                <span id="greenTarget">
                    0 / 10
                </span>

            </div>

        </div>

    </section>


    <!-- GAME BOARD -->

    <main>

        <div
            id="board"
            class="board"
        ></div>

    </main>


    <!-- BOOSTERS -->

    <section class="boosters">

        <button
            id="shuffleButton"
            class="booster"
        >

            <span class="booster-icon">
                🔀
            </span>

            <span class="booster-name">
                Перемешать
            </span>

        </button>


        <button
            id="bombButton"
            class="booster"
        >

            <span class="booster-icon">
                💣
            </span>

            <span class="booster-name">
                Бомба
            </span>

        </button>


        <button
            id="undoButton"
            class="booster"
        >

            <span class="booster-icon">
                ↩️
            </span>

            <span class="booster-name">
                Отмена
            </span>

        </button>

    </section>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message hidden"
    >

        <div class="message-window">

            <div
                id="messageIcon"
                class="message-icon"
            >
                🎉
            </div>

            <h2 id="messageTitle">
                Уровень пройден!
            </h2>

            <p id="messageText">
                Отличная работа!
            </p>

            <button
                id="nextLevelButton"
                class="main-button"
            >
                Следующий уровень
            </button>

        </div>

    </div>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >

        <div class="spinner"></div>

        <div>
            Загрузка...
        </div>

    </div>


</div>


<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if (tg) {

    tg.ready();

    tg.expand();

    try {

        tg.setHeaderColor(
            "#299fd4"
        );

        tg.setBackgroundColor(
            "#066da8"
        );

    } catch (e) {}

}


/* =========================================================
   CONFIG
========================================================= */

const SIZE = 8;

const TYPES = 6;

const START_MOVES = 30;

const SAVE_KEY =
    "fish_match_stage2";


/* =========================================================
   STATE
========================================================= */

let board = [];

let score = 0;

let moves = START_MOVES;

let level = 1;

let coins = 100;

let blue = 0;

let green = 0;

let selected = null;

let previousBoard = null;

let busy = false;


/* =========================================================
   DOM
========================================================= */

const boardElement =
    document.getElementById(
        "board"
    );

const scoreElement =
    document.getElementById(
        "score"
    );

const movesElement =
    document.getElementById(
        "moves"
    );

const levelElement =
    document.getElementById(
        "level"
    );

const coinsElement =
    document.getElementById(
        "coins"
    );

const blueElement =
    document.getElementById(
        "blueTarget"
    );

const greenElement =
    document.getElementById(
        "greenTarget"
    );

const playerNameElement =
    document.getElementById(
        "playerName"
    );

const avatarElement =
    document.getElementById(
        "avatar"
    );

const message =
    document.getElementById(
        "message"
    );

const messageIcon =
    document.getElementById(
        "messageIcon"
    );

const messageTitle =
    document.getElementById(
        "messageTitle"
    );

const messageText =
    document.getElementById(
        "messageText"
    );

const nextLevelButton =
    document.getElementById(
        "nextLevelButton"
    );

const loading =
    document.getElementById(
        "loading"
    );

const shuffleButton =
    document.getElementById(
        "shuffleButton"
    );

const bombButton =
    document.getElementById(
        "bombButton"
    );

const undoButton =
    document.getElementById(
        "undoButton"
    );


/* =========================================================
   TELEGRAM USER
========================================================= */

function loadUser() {

    if (
        !tg ||
        !tg.initDataUnsafe ||
        !tg.initDataUnsafe.user
    ) {

        return;

    }


    const user =
        tg.initDataUnsafe.user;


    playerNameElement.textContent =
        user.first_name ||
        "Игрок";


    if (user.photo_url) {

        const img =
            document.createElement(
                "img"
            );

        img.src =
            user.photo_url;

        avatarElement.innerHTML =
            "";

        avatarElement.appendChild(
            img
        );

    } else {

        avatarElement.textContent =
            (
                user.first_name ||
                "И"
            )
            .charAt(0)
            .toUpperCase();

    }

}


/* =========================================================
   RANDOM
========================================================= */

function randomType() {

    return Math.floor(
        Math.random() * TYPES
    );

}


/* =========================================================
   CREATE BOARD
========================================================= */

function createBoard() {

    board = [];


    for (
        let r = 0;
        r < SIZE;
        r++
    ) {

        board[r] = [];


        for (
            let c = 0;
            c < SIZE;
            c++
        ) {

            let type;


            do {

                type =
                    randomType();

            } while (
                createsMatch(
                    r,
                    c,
                    type
                )
            );


            board[r][c] = {

                type: type,

                special: null

            };

        }

    }


    if (
        !hasPossibleMove()
    ) {

        createBoard();

    }

}


/* =========================================================
   INITIAL MATCH
========================================================= */

function createsMatch(
    r,
    c,
    type
) {

    if (
        c >= 2 &&
        board[r][c - 1] &&
        board[r][c - 2] &&
        board[r][c - 1].type === type &&
        board[r][c - 2].type === type
    ) {

        return true;

    }


    if (
        r >= 2 &&
        board[r - 1][c] &&
        board[r - 2][c] &&
        board[r - 1][c].type === type &&
        board[r - 2][c].type === type
    ) {

        return true;

    }


    return false;

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    boardElement.innerHTML =
        "";


    for (
        let r = 0;
        r < SIZE;
        r++
    ) {

        for (
            let c = 0;
            c < SIZE;
            c++
        ) {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "cell";


            cell.dataset.row = r;

            cell.dataset.col = c;


            const gem =
                document.createElement(
                    "div"
                );


            const item =
                board[r][c];


            gem.className =
                "gem gem-" +
                item.type;


            if (
                item.special ===
                "bomb"
            ) {

                gem.classList.add(
                    "special-bomb"
                );

            }


            if (
                selected &&
                selected.r === r &&
                selected.c === c
            ) {

                cell.classList.add(
                    "selected"
                );

            }


            cell.appendChild(
                gem
            );


            addEvents(
                cell,
                r,
                c
            );


            boardElement.appendChild(
                cell
            );

        }

    }

}


/* =========================================================
   EVENTS
========================================================= */

function addEvents(
    cell,
    r,
    c
) {

    cell.addEventListener(
        "click",
        () => {

            if (busy) {
                return;
            }

            select(
                r,
                c
            );

        }
    );


    let startX = 0;

    let startY = 0;


    cell.addEventListener(
        "touchstart",
        e => {

            const touch =
                e.touches[0];


            startX =
                touch.clientX;

            startY =
                touch.clientY;

        },
        {
            passive: true
        }
    );


    cell.addEventListener(
        "touchend",
        e => {

            if (busy) {
                return;
            }


            const touch =
                e.changedTouches[0];


            const dx =
                touch.clientX -
                startX;


            const dy =
                touch.clientY -
                startY;


            if (
                Math.abs(dx) < 20 &&
                Math.abs(dy) < 20
            ) {

                select(r,c);

                return;

            }


            let tr = r;

            let tc = c;


            if (
                Math.abs(dx) >
                Math.abs(dy)
            ) {

                tc +=
                    dx > 0
                        ? 1
                        : -1;

            } else {

                tr +=
                    dy > 0
                        ? 1
                        : -1;

            }


            if (
                tr < 0 ||
                tr >= SIZE ||
                tc < 0 ||
                tc >= SIZE
            ) {

                return;

            }


            move(
                r,
                c,
                tr,
                tc
            );

        },
        {
            passive: true
        }
    );

}


/* =========================================================
   SELECT
========================================================= */

function select(r,c) {

    if (!selected) {

        selected = {
            r,
            c
        };

        render();

        return;

    }


    if (
        selected.r === r &&
        selected.c === c
    ) {

        selected = null;

        render();

        return;

    }


    if (
        adjacent(
            selected.r,
            selected.c,
            r,
            c
        )
    ) {

        move(
            selected.r,
            selected.c,
            r,
            c
        );

        return;

    }


    selected = {
        r,
        c
    };


    render();

}


/* =========================================================
   ADJACENT
========================================================= */

function adjacent(
    r1,
    c1,
    r2,
    c2
) {

    return (
        Math.abs(r1-r2) +
        Math.abs(c1-c2)
    ) === 1;

}


/* =========================================================
   SWAP
========================================================= */

function swap(
    r1,
    c1,
    r2,
    c2
) {

    const temp =
        board[r1][c1];

    board[r1][c1] =
        board[r2][c2];

    board[r2][c2] =
        temp;

}


/* =========================================================
   MOVE
========================================================= */

async function move(
    r1,
    c1,
    r2,
    c2
) {

    if (busy) {
        return;
    }


    busy = true;


    previousBoard =
        cloneBoard();


    swap(
        r1,
        c1,
        r2,
        c2
    );


    selected = null;


    render();


    await wait(130);


    const matches =
        findMatches();


    if (
        matches.length === 0
    ) {

        swap(
            r1,
            c1,
            r2,
            c2
        );


        previousBoard = null;


        render();


        busy = false;

        return;

    }


    moves--;


    update();


    await processMatches();


    if (
        checkWin()
    ) {

        busy = false;

        save();

        return;

    }


    if (
        moves <= 0
    ) {

        showLose();

        busy = false;

        save();

        return;

    }


    if (
        !hasPossibleMove()
    ) {

        shuffle();

        render();

    }


    save();


    busy = false;

}


/* =========================================================
   FIND MATCHES
========================================================= */

function findMatches() {

    const set =
        new Set();


    /*
     * HORIZONTAL
     */

    for (
        let r = 0;
        r < SIZE;
        r++
    ) {

        let start = 0;


        while (
            start < SIZE
        ) {

            const type =
                board[r][start].type;


            let end =
                start + 1;


            while (
                end < SIZE &&
                board[r][end].type === type
            ) {

                end++;

            }


            if (
                end-start >= 3
            ) {

                for (
                    let c=start;
                    c<end;
                    c++
                ) {

                    set.add(
                        r+","+c
                    );

                }

            }


            start = end;

        }

    }


    /*
     * VERTICAL
     */

    for (
        let c = 0;
        c < SIZE;
        c++
    ) {

        let start = 0;


        while (
            start < SIZE
        ) {

            const type =
                board[start][c].type;


            let end =
                start+1;


            while (
                end < SIZE &&
                board[end][c].type === type
            ) {

                end++;

            }


            if (
                end-start >= 3
            ) {

                for (
                    let r=start;
                    r<end;
                    r++
                ) {

                    set.add(
                        r+","+c
                    );

                }

            }


            start = end;

        }

    }


    return [
        ...set
    ];

}


/* =========================================================
   PROCESS MATCHES
========================================================= */

async function processMatches() {

    let combo = 0;


    while (true) {

        const matches =
            findMatches();


        if (
            matches.length === 0
        ) {

            break;

        }


        combo++;


        /*
         * Считаем элементы
         */

        for (
            const key of matches
        ) {

            const [
                r,
                c
            ] =
                key
                    .split(",")
                    .map(Number);


            const type =
                board[r][c].type;


            if (type === 0) {

                blue++;

            }


            if (type === 1) {

                green++;

            }

        }


        /*
         * Комбо
         */

        if (combo >= 2) {

            showCombo(
                combo
            );

        }


        /*
         * Очки
         */

        const points =
            matches.length *
            10 *
            combo;


        score += points;


        showScore(
            points
        );


        /*
         * Если 4+ —
         * создаём бомбу
         */

        if (
            matches.length >= 4
        ) {

            const key =
                matches[
                    Math.floor(
                        matches.length/2
                    )
                ];


            const [
                br,
                bc
            ] =
                key
                    .split(",")
                    .map(Number);


            board[br][bc].special =
                "bomb";

        }


        /*
         * Удаляем остальные
         */

        for (
            const key of matches
        ) {

            const [
                r,
                c
            ] =
                key
                    .split(",")
                    .map(Number);


            if (
                board[r][c].special ===
                "bomb"
            ) {

                continue;

            }


            board[r][c] =
                null;

        }


        update();


        await wait(230);


        collapse();


        fill();


        render();


        await wait(220);

    }

}


/* =========================================================
   COLLAPSE
========================================================= */

function collapse() {

    for (
        let c=0;
        c<SIZE;
        c++
    ) {

        let write =
            SIZE-1;


        for (
            let r=SIZE-1;
            r>=0;
            r--
        ) {

            if (
                board[r][c] !== null
            ) {

                board[write][c] =
                    board[r][c];


                if (
                    write !== r
                ) {

                    board[r][c] =
                        null;

                }


                write--;

            }

        }


        while (
            write>=0
        ) {

            board[write][c] =
                null;

            write--;

        }

    }

}


/* =========================================================
   FILL
========================================================= */

function fill() {

    for (
        let r=0;
        r<SIZE;
        r++
    ) {

        for (
            let c=0;
            c<SIZE;
            c++
        ) {

            if (
                board[r][c] === null
            ) {

                board[r][c] = {

                    type:
                        randomType(),

                    special:
                        null

                };

            }

        }

    }

}


/* =========================================================
   CHECK WIN
========================================================= */

function checkWin() {

    const target =
        10 +
        (level-1)*2;


    if (
        blue >= target &&
        green >= target
    ) {

        showWin();

        return true;

    }


    return false;

}


/* =========================================================
   WIN
========================================================= */

function showWin() {

    coins +=
        50 +
        level*10;


    messageIcon.textContent =
        "🏆";


    messageTitle.textContent =
        "Уровень пройден!";


    messageText.textContent =
        "Получено монет: " +
        (
            50 +
            level*10
        );


    nextLevelButton.textContent =
        "Следующий уровень";


    message.classList.remove(
        "hidden"
    );


    busy = true;


    save();

}


/* =========================================================
   LOSE
========================================================= */

function showLose() {

    messageIcon.textContent =
        "💔";


    messageTitle.textContent =
        "Попробуй ещё раз";


    messageText.textContent =
        "Ходы закончились.";


    nextLevelButton.textContent =
        "Повторить уровень";


    message.classList.remove(
        "hidden"
    );


    busy = true;

}


/* =========================================================
   NEXT LEVEL
========================================================= */

nextLevelButton.addEventListener(
    "click",
    function() {

        const won =
            blue >=
                (10+(level-1)*2) &&
            green >=
                (10+(level-1)*2);


        message.classList.add(
            "hidden"
        );


        if (won) {

            level++;

        }


        score = 0;

        moves =
            START_MOVES;


        blue = 0;

        green = 0;


        selected = null;

        previousBoard = null;


        createBoard();


        update();

        render();


        busy = false;


        save();

    }
);


/* =========================================================
   BOMB
========================================================= */

bombButton.addEventListener(
    "click",
    async function() {

        if (
            busy ||
            moves <= 0
        ) {

            return;

        }


        busy = true;


        previousBoard =
            cloneBoard();


        moves--;


        /*
         * Случайный центр
         */

        const r =
            Math.floor(
                Math.random()*SIZE
            );


        const c =
            Math.floor(
                Math.random()*SIZE
            );


        /*
         * 3x3
         */

        for (
            let rr=r-1;
            rr<=r+1;
            rr++
        ) {

            for (
                let cc=c-1;
                cc<=c+1;
                cc++
            ) {

                if (
                    rr>=0 &&
                    rr<SIZE &&
                    cc>=0 &&
                    cc<SIZE
                ) {

                    const item =
                        board[rr][cc];


                    if (
                        item.type === 0
                    ) {

                        blue++;

                    }


                    if (
                        item.type === 1
                    ) {

                        green++;

                    }


                    score += 10;


                    board[rr][cc] =
                        null;

                }

            }

        }


        update();


        render();


        await wait(200);


        collapse();

        fill();


        render();


        if (
            checkWin()
        ) {

            busy = false;

            return;

        }


        if (
            moves <= 0
        ) {

            showLose();

            busy = false;

            return;

        }


        busy = false;


        save();

    }
);


/* =========================================================
   SHUFFLE
========================================================= */

shuffleButton.addEventListener(
    "click",
    function() {

        if (
            busy ||
            moves <= 0
        ) {

            return;

        }


        previousBoard =
            cloneBoard();


        moves--;


        shuffle();


        update();

        render();


        if (
            moves <= 0
        ) {

            if (
                !checkWin()
            ) {

                showLose();

            }

        }


        save();

    }
);


/* =========================================================
   SHUFFLE BOARD
========================================================= */

function shuffle() {

    const items = [];


    for (
        let r=0;
        r<SIZE;
        r++
    ) {

        for (
            let c=0;
            c<SIZE;
            c++
        ) {

            items.push(
                board[r][c]
            );

        }

    }


    for (
        let i=items.length-1;
        i>0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random()*(i+1)
            );


        [
            items[i],
            items[j]
        ] =
        [
            items[j],
            items[i]
        ];

    }


    let index=0;


    for (
        let r=0;
        r<SIZE;
        r++
    ) {

        for (
            let c=0;
            c<SIZE;
            c++
        ) {

            board[r][c] =
                items[index++];

        }

    }


    if (
        findMatches().length ||
        !hasPossibleMove()
    ) {

        createBoard();

    }

}


/* =========================================================
   UNDO
========================================================= */

undoButton.addEventListener(
    "click",
    function() {

        if (
            busy ||
            !previousBoard
        ) {

            return;

        }


        board =
            cloneSpecificBoard(
                previousBoard
            );


        previousBoard =
            null;


        render();

        update();

    }
);


/* =========================================================
   CLONE
========================================================= */

function cloneBoard() {

    return cloneSpecificBoard(
        board
    );

}


function cloneSpecificBoard(
    source
) {

    return source.map(
        row =>
            row.map(
                item =>
                    item
                        ? {
                            type:
                                item.type,

                            special:
                                item.special
                        }
                        : null
            )
    );

}


/* =========================================================
   POSSIBLE MOVE
========================================================= */

function hasPossibleMove() {

    for (
        let r=0;
        r<SIZE;
        r++
    ) {

        for (
            let c=0;
            c<SIZE;
            c++
        ) {


            if (
                c<SIZE-1
            ) {

                swap(
                    r,
                    c,
                    r,
                    c+1
                );


                const found =
                    findMatches().length;


                swap(
                    r,
                    c,
                    r,
                    c+1
                );


                if (found) {

                    return true;

                }

            }


            if (
                r<SIZE-1
            ) {

                swap(
                    r,
                    c,
                    r+1,
                    c
                );


                const found =
                    findMatches().length;


                swap(
                    r,
                    c,
                    r+1,
                    c
                );


                if (found) {

                    return true;

                }

            }

        }

    }


    return false;

}


/* =========================================================
   UPDATE
========================================================= */

function update() {

    scoreElement.textContent =
        score;


    movesElement.textContent =
        moves;


    levelElement.textContent =
        level;


    coinsElement.textContent =
        coins;


    const target =
        10 +
        (level-1)*2;


    blueElement.textContent =
        blue +
        " / " +
        target;


    greenElement.textContent =
        green +
        " / " +
        target;


    shuffleButton.disabled =
        busy ||
        moves<=0;


    bombButton.disabled =
        busy ||
        moves<=0;


    undoButton.disabled =
        busy ||
        !previousBoard;

}


/* =========================================================
   SCORE POPUP
========================================================= */

function showScore(
    points
) {

    const popup =
        document.createElement(
            "div"
        );


    popup.className =
        "score-popup";


    popup.textContent =
        "+" +
        points;


    popup.style.left =
        "50%";


    popup.style.top =
        "45%";


    document.body.appendChild(
        popup
    );


    setTimeout(
        () => {

            popup.remove();

        },
        800
    );

}


/* =========================================================
   COMBO
========================================================= */

function showCombo(
    number
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "combo";


    element.textContent =
        "КОМБО x" +
        number;


    document.body.appendChild(
        element
    );


    setTimeout(
        () => {

            element.remove();

        },
        800
    );

}


/* =========================================================
   SAVE
========================================================= */

function save() {

    try {

        localStorage.setItem(
            SAVE_KEY,

            JSON.stringify({

                board,

                score,

                moves,

                level,

                coins,

                blue,

                green

            })
        );

    } catch(e) {}

}


/* =========================================================
   LOAD
========================================================= */

function load() {

    try {

        const raw =
            localStorage.getItem(
                SAVE_KEY
            );


        if (!raw) {

            return false;

        }


        const data =
            JSON.parse(raw);


        if (
            !data.board ||
            data.board.length !== SIZE
        ) {

            return false;

        }


        board =
            data.board;


        score =
            Number(data.score) || 0;


        moves =
            Number(data.moves) ||
            START_MOVES;


        level =
            Number(data.level) || 1;


        coins =
            Number(data.coins) || 100;


        blue =
            Number(data.blue) || 0;


        green =
            Number(data.green) || 0;


        return true;

    } catch(e) {

        return false;

    }

}


/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================
   START
========================================================= */

function start() {

    loadUser();


    const loaded =
        load();


    if (!loaded) {

        level = 1;

        score = 0;

        moves =
            START_MOVES;

        coins = 100;

        blue = 0;

        green = 0;

        createBoard();

    }


    if (
        !board ||
        board.length !== SIZE ||
        !hasPossibleMove()
    ) {

        createBoard();

    }


    update();

    render();


    setTimeout(
        () => {

            loading.classList.add(
                "hidden"
            );

        },
        200
    );

}


start();

</script>
